<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine</title>
<style>
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(to bottom, #ffe0e6, #fff0f5);
    font-family: 'Comic Sans MS', cursive;
    overflow: hidden;
  }

  h1 {
    color: #ff1a75;
    font-size: 2.5em;
    text-align: center;
    animation: pulse 1.2s infinite alternate;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.1); }
  }

  button {
    padding: 15px 40px;
    font-size: 1.3em;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    transition: all 0.1s ease;
    box-shadow: 0px 5px 15px rgba(255,0,100,0.3);
    position: absolute;
  }

  #yesBtn {
    background: linear-gradient(45deg, #ff6699, #ff1a75);
    color: white;
  }

  #noBtn {
    background: linear-gradient(45deg, #ffccff, #ff99cc);
    color: #ff1a75;
  }

  .heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    transform: rotate(45deg);
    animation: floatUp 4s linear infinite;
    opacity: 0.7;
  }

  .heart:before, .heart:after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    border-radius: 50%;
  }

  .heart:before { top: -10px; left: 0; }
  .heart:after { left: 10px; top: 0; }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(45deg); opacity: 0.7; }
    100% { transform: translateY(-800px) rotate(45deg); opacity: 0; }
  }

  @media(max-width: 500px){
    h1 { font-size: 2em; }
    button { padding: 12px 25px; font-size: 1em; }
  }
</style>
</head>
<body>

<h1>Would you be my Valentine? ❤️</h1>

<button id="yesBtn">Yes</button>
<button id="noBtn">No</button>

<script>
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');

// Position buttons on load and resize
function positionButtons() {
    yesBtn.style.left = (window.innerWidth/2 - yesBtn.offsetWidth - 10) + 'px';
    yesBtn.style.top = (window.innerHeight/2 + 50) + 'px';

    noBtn.style.left = (window.innerWidth/2 + 10) + 'px';
    noBtn.style.top = (window.innerHeight/2 + 50) + 'px';
}
window.addEventListener('load', positionButtons);
window.addEventListener('resize', positionButtons);

// Move No button anywhere, avoiding cursor/touch
function moveNoButton(x, y) {
    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;
    const padding = 30;

    const maxX = window.innerWidth - btnWidth;
    const maxY = window.innerHeight - btnHeight;

    let newX, newY;
    do {
        newX = Math.random() * maxX;
        newY = Math.random() * maxY;
    } while (
        x >= newX - padding &&
        x <= newX + btnWidth + padding &&
        y >= newY - padding &&
        y <= newY + btnHeight + padding
    );

    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';
}

// Desktop hover
noBtn.addEventListener('mouseenter', (e) => {
    moveNoButton(e.clientX, e.clientY);
});

// Mobile: chase finger continuously
let touchMoveInterval;
noBtn.addEventListener('touchstart', (e) => {
    const touch = e.touches[0];
    moveNoButton(touch.clientX, touch.clientY);

    // Move continuously while touching
    touchMoveInterval = setInterval(() => {
        moveNoButton(touch.clientX, touch.clientY);
    }, 50);
});
noBtn.addEventListener('touchend', () => {
    clearInterval(touchMoveInterval);
});

// Yes button redirects
yesBtn.addEventListener('click', () => {
    window.location.href = 'yes.html';
});

// Floating hearts
function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.animationDuration = (2 + Math.random() * 3) + 's';
    document.body.appendChild(heart);
    setTimeout(() => { heart.remove(); }, 4000);
}
setInterval(createHeart, 300);
</script>

</body>
</html>
